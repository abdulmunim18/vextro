<!doctype html>
<html>
<head><title>Apple Iphone 17 — PriceOye fixture</title></head>
<body>
<div class="product-detail-wrap">
  <h1>Apple Iphone 17</h1>
  <div class="product-price po-price-border">
    <div class="product-prcing-sections">
      <div class="product-prcing-section">
        <span class="summary-price price-size-lg"><sup>Rs</sup>384,999</span>
        <div class="save-retail-pricebox">
          <div class="retail-price market-price">
            <span class="summary-price line-through stock-info"><sup>Rs</sup>399,000</span>
          </div>
        </div>
        <div class="save-price-section"><span class="save-price">4% OFF</span></div>
      </div>
    </div>
  </div>

  <!-- Captured from live PriceOye on 2026-10-01. Sold-out colours
       carry an empty <span class="sold-out-tag"></span>; available
       colours have no such span. The "active" li is whichever colour
       PriceOye renders in the main gallery by default. -->
  <ul class="colors">
    <li class="">
      <a class="ga-dataset MYcolors" data-tooltip-template="black" data-vars-value="black">
        <div class="title product-color-image-thumbnail position-relative overflow-visible black">
          <span class="sold-out-tag"></span>
          <div class="product-color-image fadeProduct">
            <img src="https://images.priceoye.pk/apple-iphone-17-pakistan-priceoye-wr7vg-100x100.webp" alt="Apple Iphone 17" width="45" height="45" class="product-detail-image">
          </div>
          <div class="color-name">Black</div>
        </div>
      </a>
    </li>
    <li class="">
      <a class="ga-dataset MYcolors" data-tooltip-template="white" data-vars-value="white">
        <div class="title product-color-image-thumbnail position-relative overflow-visible white">
          <span class="sold-out-tag"></span>
          <div class="product-color-image fadeProduct">
            <img src="https://images.priceoye.pk/apple-iphone-17-pakistan-priceoye-bhxgm-100x100.webp" alt="Apple Iphone 17" width="45" height="45" class="product-detail-image">
          </div>
          <div class="color-name">White</div>
        </div>
      </a>
    </li>
    <li class="active">
      <a class="ga-dataset MYcolors" data-tooltip-template="sage" data-vars-value="sage">
        <div class="title product-color-image-thumbnail position-relative overflow-visible sage active">
          <div class="product-color-image">
            <img src="https://images.priceoye.pk/apple-iphone-17-pakistan-priceoye-yknw6-100x100.webp" alt="Apple Iphone 17" width="45" height="45" class="product-detail-image">
          </div>
          <div class="color-name">Sage</div>
        </div>
      </a>
    </li>
    <li class="">
      <a class="ga-dataset MYcolors" data-tooltip-template="lavender" data-vars-value="lavender">
        <div class="title product-color-image-thumbnail position-relative overflow-visible lavender">
          <div class="product-color-image">
            <img src="https://images.priceoye.pk/apple-iphone-17-pakistan-priceoye-8ajbm-100x100.webp" alt="Apple Iphone 17" width="45" height="45" class="product-detail-image">
          </div>
          <div class="color-name">Lavender</div>
        </div>
      </a>
    </li>
    <li class="">
      <a class="ga-dataset MYcolors" data-tooltip-template="mist_blue" data-vars-value="mist_blue">
        <div class="title product-color-image-thumbnail position-relative overflow-visible mist_blue">
          <span class="sold-out-tag"></span>
          <div class="product-color-image fadeProduct">
            <img src="https://images.priceoye.pk/apple-iphone-17-pakistan-priceoye-9fkkr-100x100.webp" alt="Apple Iphone 17" width="45" height="45" class="product-detail-image">
          </div>
          <div class="color-name">Mist Blue</div>
        </div>
      </a>
    </li>
  </ul>

  <img class="main-product-img" src="https://images.priceoye.pk/apple-iphone-17-pakistan-priceoye-mxvta-500x500.webp" alt="Apple Iphone 17">

  <table>
    <tr><td>Warranty</td><td>1 Year Official Warranty</td></tr>
  </table>

  <div id="specifications">
    <table>
      <tr><th>RAM</th><td>8 GB</td></tr>
      <tr><th>Storage</th><td>256 GB</td></tr>
    </table>
  </div>
</div>
</body>
</html>
